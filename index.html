<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abel&family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Simulator</title>
  </head>
  <body>
    <h1>IOT Simulator Dashboard</h1>

    <!-- <button>Create Sensor</button>
    <button>List Sensors</button> -->

    <h2>Environment Settings</h2>

    <button id="abc">Update Ambient Temp to 99</button>

    <h2>Sensors</h2>

    <form id="createSensorForm" action="">
      <input
        id="sensorId"
        name="sensorId"
        type="number"
        required="true"
        min="1"
        placeholder="sensor ID" />

      <select name="sensorType" id="sensorType">
        
      </select>

      <input
        type="number"
        name="interval"
        id="interval"
        min="1"
        placeholder="Interval (ms)" />
      <button type="submit" id="sensorFormSubmit">Create</button>
    </form>
    <div class="sensorList" id="sensorList"></div>

    <h2>Devices</h2>

    <form id="createDeviceForm" action="">
      <input
        id="deviceId"
        name="deviceId"
        type="number"
        required
        min="1"
        placeholder="Device ID" />

      <input
        type="number"
        name="interval"
        id="interval"
        required
        min="1"
        placeholder="Interval (ms)" />

      <label
        >Choose a Temp Sensor:

        <select name="sensorId" id="tempSensorSelect" required>
          <option value="">Loading Sensors ....</option>
        </select>
      </label>

      <button type="submit" id="deviceFormSubmit">CreateHVAC</button>
    </form>

    <div class="deviceList" id="deviceList"></div>
  </body>

  <script src="./app.js" type="module"></script>
</html>
